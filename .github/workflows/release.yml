name: Build Apps

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config rpm imagemagick libarchive-tools

      - name: Generate Linux icons
        run: |
          mkdir -p build/icons
          for size in 16 32 48 64 128 256 512; do
            convert assets/coinswap.png -resize ${size}x${size} build/icons/${size}x${size}.png
          done

      - run: sudo snap install snapcraft --classic
      - run: npm ci --ignore-scripts
      - run: node setup-coinswap.js
      - run: npm run build:css
      - run: npm run build:electron -- --linux --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-apps
          path: |
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.pacman
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate macOS icon
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size assets/coinswap.png --out "build/icon.iconset/icon_${size}x${size}.png"
          done
          for size in 16 32 64 128 256 512; do
            sips -z $((size*2)) $((size*2)) assets/coinswap.png --out "build/icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - run: npm ci --ignore-scripts
      - run: node setup-coinswap.js
      - run: npm run build:css
      - run: npm run build:electron -- --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-apps
          path: |
            dist/*.dmg
            dist/mac/*.zip
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate Windows icon
        run: |
          mkdir build
          magick convert assets/coinswap.png -define icon:auto-resize=256,128,64,48,32,16 build/icon.ico

      - run: npm ci --ignore-scripts
      - run: node setup-coinswap.js
      - run: npm run build:css
      - run: npm run build:electron -- --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-apps
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: warn

  comment-pr:
    if: github.event_name == 'pull_request'
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `
            ✅ Apps built successfully for this PR.

            Artifacts are available here:

            - Linux apps
            - macOS apps
            - Windows apps

            Download them from the workflow run:

            ${runUrl}
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
